<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access activated — AuditorIA</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#070b14;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;margin:0}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:40px;max-width:440px;width:100%;text-align:center}
.icon{width:64px;height:64px;background:rgba(16,185,129,.15);color:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}
h1{font-size:1.5rem;margin:0 0 12px}
p{color:#94a3b8;line-height:1.6;margin:0 0 16px}
.plan{font-weight:700;color:#10b981;font-size:1.1rem;margin-bottom:8px}
.btn{display:inline-block;background:#10b981;color:#fff;padding:14px 28px;border-radius:8px;font-weight:600;text-decoration:none;margin-top:8px}
.note{font-size:.8rem;margin-top:24px;padding-top:20px;border-top:1px solid #1e293b;color:#64748b;line-height:1.5}
.status{font-size:.9rem;color:#f59e0b;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">✓</div>
  <h1 id="title">Activating…</h1>
  <div class="plan" id="planName"></div>
  <p class="status" id="status">Checking payment status…</p>
  <p id="msg">Please wait a few seconds while we confirm your payment with NOWPayments.</p>
  <a class="btn" href="index.html" id="dashBtn" style="display:none">Open dashboard</a>
  <div class="note">Subscription lasts 30 days from activation. Free plan: 2 contract analyses.</div>
</div>
<script>
(function(){
  // CHANGE to your Worker URL after deploy
  var WORKER_URL = "https://YOUR_WORKER.YOUR_SUBDOMAIN.workers.dev";
  var MONTH_MS = 30 * 24 * 60 * 60 * 1000;
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order_id") || localStorage.getItem("auditoria_pending_order");
  var plan = params.get("plan") || localStorage.getItem("auditoria_pending_plan") || "starter";

  function activate(p){
    var sub = { plan: p, freeLeft: 2, expires: Date.now() + MONTH_MS };
    try {
      localStorage.setItem("auditoria_sub", JSON.stringify(sub));
      localStorage.removeItem("auditoria_pending_plan");
      localStorage.removeItem("auditoria_pending_order");
    } catch(e){}
    document.getElementById("icon").textContent = "✓";
    document.getElementById("title").textContent = "Subscription activated";
    document.getElementById("planName").textContent = (p === "growth" ? "Growth" : "Starter") + " — 30 days";
    document.getElementById("status").textContent = "";
    document.getElementById("msg").textContent = "Your monthly access is active. Open the dashboard to analyze contracts without limits.";
    document.getElementById("dashBtn").style.display = "inline-block";
  }

  async function check(){
    if (!orderId || WORKER_URL.indexOf("YOUR_WORKER") !== -1) {
      // No worker yet: activate on trust when user lands from success_url
      activate(plan);
      return;
    }
    try {
      var res = await fetch(WORKER_URL.replace(/\/$/, "") + "/status?order_id=" + encodeURIComponent(orderId));
      var data = await res.json();
      if (data.paid || data.status === "paid") {
        activate(data.plan || plan);
        return;
      }
      document.getElementById("status").textContent = "Payment status: " + (data.status || "pending");
      document.getElementById("msg").textContent = "Waiting for blockchain confirmation… This page will update automatically.";
      setTimeout(check, 5000);
    } catch(e) {
      // Network error — still allow activation if redirected from success_url
      activate(plan);
    }
  }
  check();
})();
</script>
</body>
</html>
